# Include inside the games.nostalgiarealm.com server block.
# Files: /var/www/games.nostalgiarealm.com/redcatspookkasteel/index.html, etc.
location = /redcatspookkasteel {
    return 301 /redcatspookkasteel/$is_args$args;
}

location ^~ /redcatspookkasteel/ {
    root /var/www/games.nostalgiarealm.com;
    index index.html;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    try_files $uri $uri/ =404;
    autoindex off;
    # Filenames are not content-hashed. Revalidate cached files after updates.
    expires -1;
}
