# RedCat Spookkasteel at https://games.nostalgiarealm.com/redcatspookkasteel/: the recompiled port,
# with the JavaScript port kept beside it at /redcatspookkasteel/classic/.
#
# This takes the place of the one block "location /redcatspookkasteel/ { ... }" in the server
# block of games.nostalgiarealm.com (as that block was on 13 November 2026): put this file at
# /etc/nginx/snippets/redcatspookkasteel-recomp.conf and write, where that block was,
#     include /etc/nginx/snippets/redcatspookkasteel-recomp.conf;
# The two locations above it stay as they are:
#     location = /redcatspookkasteel { return 301 /redcatspookkasteel/; }
#     location ~ ^/redcatspookkasteel/(?:\.|.*/\.) { return 404; }
#
# Folders on the server, side by side:
#     /var/www/games.nostalgiarealm.com/redcatspookkasteel/redcat-recomp/     this port (dist/site)
#     /var/www/games.nostalgiarealm.com/redcatspookkasteel/redcat-website/    the JavaScript port, untouched
# Nothing is moved: the switch is this change plus a reload, and going back is the old block plus
# a reload.
#
# Needs nginx-redcatspookkasteel-cache.conf (the variable $redcat_cache_control) in the http block.
# The steps are in docs/hosting.md. Not run through nginx here (none installed): "sudo nginx -t".

    # RedCat Spookkasteel, recompiled port.
    location /redcatspookkasteel/ {
        alias /var/www/games.nostalgiarealm.com/redcatspookkasteel/redcat-recomp/;
        index index.html;
        autoindex off;
        include /etc/nginx/mime.types;
        types { audio/wav wav; }

        # The page shares memory with the game thread, which a browser only allows on an isolated
        # page: without these two headers the game does not start (the page then says so).
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;

        # What a browser may keep, by folder (the other file). A location with add_header lines of
        # its own no longer gets the server's "Cache-Control: no-cache"; this line replaces it.
        add_header Cache-Control $redcat_cache_control;

        # Sends the .gz copy that lies next to a file to a browser that accepts it (the game
        # module is 13 MB, its .gz 1.8 MB). Needs the module: nginx -V 2>&1 | grep -o http_gzip_static_module
        # Without it "nginx -t" rejects the line: remove it, the site works without.
        gzip_static on;
    }

    # The JavaScript port, served as it was until now, for continuing a saved game at its exact
    # place. This is the old block with another address; it keeps the server's own headers.
    location /redcatspookkasteel/classic/ {
        alias /var/www/games.nostalgiarealm.com/redcatspookkasteel/redcat-website/;
        index index.html;
        autoindex off;
        include /etc/nginx/mime.types;
        types { audio/wav wav; }
    }
