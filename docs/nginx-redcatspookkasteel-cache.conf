# RedCat Spookkasteel, recompiled port: what a browser may keep, by folder.
#
# http-level part: a "map" is only allowed in the http block. On Debian, files in
# /etc/nginx/conf.d/ are included there (check: grep -n conf.d /etc/nginx/nginx.conf), so put this
# file at /etc/nginx/conf.d/redcatspookkasteel-recomp-cache.conf. Used by nginx-redcatspookkasteel.conf.
#
#   app/     scripts and the game module. Every build has its own folder name below app/, so a
#            file under a given address never changes.
#   data/    the original game files. They do not change.
#   assets/  menu artwork, voices, music, movies: kept for a day.
#   other    index.html and build.json: checked with the server every time ("no-cache": the
#            browser may keep a copy but must ask whether it is current).
# The old version under classic/ has its own location and does not use this variable.

# "(?:-test)?" also covers the temporary address of nginx-redcatspookkasteel-test.conf.

map $uri $redcat_cache_control {
    default                                  "no-cache";
    ~^/redcatspookkasteel(?:-test)?/app/     "public, max-age=31536000, immutable";
    ~^/redcatspookkasteel(?:-test)?/data/    "public, max-age=31536000, immutable";
    ~^/redcatspookkasteel(?:-test)?/assets/  "public, max-age=86400";
}
