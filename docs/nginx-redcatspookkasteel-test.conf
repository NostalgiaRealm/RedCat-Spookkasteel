# RedCat Spookkasteel, recompiled port: a temporary address to try the uploaded package on the
# real server before the switch. https://games.nostalgiarealm.com/redcatspookkasteel-test/
#
# The same location as the final one (nginx-redcatspookkasteel.conf) under another address; the
# live game is not touched by it. Include it inside the server block of games.nostalgiarealm.com,
# check with tools/site-check.mjs, and take the include line out again at the switch.
# Needs nginx-redcatspookkasteel-cache.conf in the http block. Steps: docs/hosting.md.

    location = /redcatspookkasteel-test {
        return 301 /redcatspookkasteel-test/;
    }

    location /redcatspookkasteel-test/ {
        alias /var/www/games.nostalgiarealm.com/redcatspookkasteel/redcat-recomp/;
        index index.html;
        autoindex off;
        include /etc/nginx/mime.types;
        types { audio/wav wav; }

        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cache-Control $redcat_cache_control;
        gzip_static on;
    }
