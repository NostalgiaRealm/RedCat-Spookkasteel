WINTEXT=Ja ja ja, als Erster am Ziel Sie fahren wirklich phantastisch. Sie sind doch nicht ein Schumacher, he? Hahaha. Ihre Belohnung: Sie dürfen am Glücksrad drehen! Melden Sie sich anschließend noch kurz für den Dopingtest?
