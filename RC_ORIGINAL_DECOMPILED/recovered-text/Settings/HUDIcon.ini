;// -----------------------------------------------------
;// Header Icon File
;// -----------------------------------------------------

;// -----------------------------------------------------
;// DEFINITION
;// -----------------------------------------------------
;// IconType definition
;0=Normal,	a still icon frame
;1=Number,	a set of numbers (must be 10 icons), a value given will automaticaly be converted
;2=Text,	a series of characters (must be 26+), a string given will automaticaly be converted
;3=Animation,a series of frames that needs to be given, The frame rate is hard coded.
;4=Progress,	a meter indicating the progress. two frames are needed here, one empty and one full. The percentage given is converted in a empty and a full frame;
;5=Container,a special version for displaying the health as hart containers

;// -----------------------------------------------------
;// Icon List available
;// -----------------------------------------------------
;// The code uses the name to update the display
;// These names are static const strings in the code and are used by the code to access the icon data
;// Change them accordingly

;//0=LifeIcon
;//1=LifeNumber
;//2=HealthContainer
;//3=ScoreIcon
;//4=ScoreNumber
;//5=PotionIcon
;//6=PotionNumber
;//7=Slash
;//8=TotalPotionNumber
;//9=EnemyPortrait
;//10=EnemyHealth

[Icon Define]
Define0=LifeIcon
Define1=LifeNumber
Define2=HealthContainer
Define3=ScoreIcon
Define4=ScoreNumber
Define5=PotionIcon
Define6=PotionNumber
Define7=Slash
Define8=TotalPotionNumber
Define9=EnemyPortrait
Define10=EnemyHealth
Define11=HealthIcon



